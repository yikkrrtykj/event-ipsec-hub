name: V4 Go + Vue 3 CI

on:
  push:
    branches: [main, v4-go]
  pull_request:
    branches: [main, v4-go]

permissions:
  contents: read

jobs:
  build-and-verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod
      - name: Build Vue 3 + TypeScript + ECharts frontend bundle
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build
      - name: ShellCheck V4 installer
        run: shellcheck scripts/install-v4.sh
      - name: Go vet & unit tests (race)
        run: |
          go vet ./...
          go test -race -v ./...
      - name: Build single static Linux amd64 binary (with embedded SPA) and smoke-test
        run: |
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o bin/ipsecvpn ./cmd/ipsecvpn
          ls -lh bin/ipsecvpn
          ./bin/ipsecvpn version
          ./bin/ipsecvpn profiles list --directory tests/fixtures --json
          ./bin/ipsecvpn validate -c config/event.example.yaml --json
          ./bin/ipsecvpn validate -c config/esports-multi-ob-hillstone.example.yaml --json
          ./bin/ipsecvpn render -c config/esports-multi-ob-hillstone.example.yaml --json >/dev/null
          ./bin/ipsecvpn export-peer -c config/esports-multi-ob-hillstone.example.yaml --site ob-venue-1 --format tencent-json
          ./bin/ipsecvpn export-peer -c config/esports-multi-ob-hillstone.example.yaml --site ob-venue-1 --format hillstone-draft >/dev/null
      - name: Scan reachable commits for secrets
        run: |
          scan_dir="$(mktemp -d)"
          trap 'rm -rf -- "$scan_dir"' EXIT
          archive=gitleaks_8.24.2_linux_x64.tar.gz
          curl --fail --silent --show-error --location \
            "https://github.com/gitleaks/gitleaks/releases/download/v8.24.2/$archive" \
            --output "$scan_dir/$archive"
          (
            cd "$scan_dir"
            printf '%s  %s\n' \
              fa0500f6b7e41d28791ebc680f5dd9899cd42b58629218a5f041efa899151a8e "$archive" \
              | sha256sum --check --strict
            tar -xzf "$archive" gitleaks
          )
          "$scan_dir/gitleaks" git --redact=100 --no-banner --log-opts=HEAD .
