name: PR4 isolated monitoring

on:
  pull_request:
    branches: [main]
    paths:
      - 'ipsecvpn/**'
      - 'monitoring/**'
      - 'scripts/pr4-lab/**'
      - 'scripts/pr2-vm/**'
      - 'scripts/pr3-lab/**'
      - '.github/workflows/pr4-lab.yml'
      - 'config/**'
      - 'pyproject.toml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  monitoring:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: '3.12'
      - name: Verify monitoring on a disposable Ubuntu QEMU guest
        env:
          IPSECVPN_EVIDENCE_FILE: ${{ runner.temp }}/ipsecvpn-pr4-acceptance.jsonl
        run: bash scripts/pr2-vm/run.sh pr4
      - name: Save sanitized monitoring evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: ipsecvpn-pr4-lab-evidence
          path: ${{ runner.temp }}/ipsecvpn-pr4-acceptance.jsonl
