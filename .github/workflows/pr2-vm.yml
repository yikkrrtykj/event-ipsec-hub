name: PR2 isolated Ubuntu VM

on:
  pull_request:
    branches: [main]
    paths:
      - 'ipsecvpn/**'
      - 'scripts/pr2-vm/**'
      - '.github/workflows/pr2-vm.yml'
      - 'config/**'
      - 'pyproject.toml'

permissions:
  contents: read

jobs:
  qemu:
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405 # v6.2.0
        with:
          python-version: '3.12'
      - name: ShellCheck the VM harness
        run: shellcheck scripts/pr2-vm/*.sh
      - name: Verify inside a disposable isolated guest
        env:
          IPSECVPN_EVIDENCE_FILE: ${{ runner.temp }}/ipsecvpn-acceptance.jsonl
        run: bash scripts/pr2-vm/run.sh
      - name: Save sanitized acceptance evidence
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ipsecvpn-pr2-vm-evidence
          path: ${{ runner.temp }}/ipsecvpn-acceptance.jsonl
