name: V4 Release Single-Binary Packaging

on:
  push:
    tags:
      - 'v4.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '22'
      - uses: actions/setup-go@40f1582b2485089dde7abd97c1529aa768e1baff # v5
        with:
          go-version-file: go.mod

      - name: Build embedded Vue 3 + ECharts SPA
        working-directory: web
        run: |
          npm ci --no-audit --no-fund
          npm run build

      - name: Run Go vet and unit tests
        run: |
          go vet ./...
          go test -race ./...

      - name: Build static single-binary release artifacts
        run: |
          mkdir -p release
          CGO_ENABLED=0 GOOS=linux GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o release/ipsecvpn-linux-amd64 ./cmd/ipsecvpn
          CGO_ENABLED=0 GOOS=linux GOARCH=arm64 go build -trimpath -ldflags='-s -w' -o release/ipsecvpn-linux-arm64 ./cmd/ipsecvpn
          CGO_ENABLED=0 GOOS=windows GOARCH=amd64 go build -trimpath -ldflags='-s -w' -o release/ipsecvpn-windows-amd64.exe ./cmd/ipsecvpn
          cp scripts/install-v4.sh release/install-v4.sh
          (cd release && sha256sum ipsecvpn-linux-amd64 ipsecvpn-linux-arm64 ipsecvpn-windows-amd64.exe install-v4.sh > SHA256SUMS)
          ls -lh release/
          cat release/SHA256SUMS

      - name: Upload build artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: event-ipsec-hub-v4-binaries
          path: release/*

      - name: Publish GitHub Release on tag
        if: startsWith(github.ref, 'refs/tags/v4.')
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${GITHUB_REF_NAME}"
          gh release create "$TAG" release/* \
            --title "event-ipsec-hub ${TAG}" \
            --notes "Single-binary Go + embedded Vue 3 VPN Gateway appliance for Ubuntu 24.04. See docs/V4_OPERATIONS.md for installation and hardening instructions."
